{% extends 'base.html' %}
{% load static %}
{% block title %}Live auction · AuctionHub{% endblock %}
{% block content %}
<a class="back-link" href="/products/">← Back to marketplace</a>
<div class="row g-4 mt-1 align-items-start">
  <section class="col-lg-7">
    <div class="form-panel">
      <span id="auction-status" class="market-tag">LOADING AUCTION</span>
      <h1 id="auction-title" class="mt-3">Auction details</h1>
      <p id="auction-description" class="text-muted">Loading current auction information…</p>
      <span class="field-help">Current price</span>
      <div class="display-5 fw-bold" id="price">—</div>
      <p id="events" class="form-message mt-3" role="status" aria-live="polite"></p>
    </div>
  </section>
  <section class="col-lg-5">
    <form id="bid-form" class="form-panel">
      <span class="eyebrow">MAKE YOUR MOVE</span>
      <h2>Place a bid</h2>
      <label class="form-label" for="amount">Your bid</label>
      <input id="amount" type="number" min="0.01" step="0.01" class="form-control mb-2" required>
      <p id="minimum" class="field-help small"></p>
      <button id="bid" class="btn btn-primary w-100" type="submit">Place bid</button>
      <button id="connect" class="btn btn-link w-100 mt-2" type="button">Reconnect live updates</button>
      <p id="bid-message" class="form-message mt-2" role="status"></p>
    </form>
  </section>
</div>
<script>
const auctionId = new URLSearchParams(location.search).get('auction');
const eventLog = document.getElementById('events');
const bidMessage = document.getElementById('bid-message');
const bidButton = document.getElementById('bid');
let socket;
let auction;
function connectLiveUpdates() {
  const token = localStorage.getItem('access');
  if (!auctionId || !token) {
    eventLog.textContent = 'Sign in to receive live updates and bid.';
    return;
  }
  if (socket) socket.close();
  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  socket = new WebSocket(`${scheme}//${location.host}/ws/auctions/${auctionId}/`, ['jwt', token]);
  socket.addEventListener('message', (event) => {
    try {
      const data = JSON.parse(event.data);
      const bidUpdate = data.data || data;
      if (bidUpdate.amount) document.getElementById('price').textContent = window.marketplace.money(bidUpdate.amount);
      eventLog.textContent = data.message || 'A new bid was placed.';
      loadAuction();
    } catch {
      eventLog.textContent = 'Received an unreadable auction update.';
    }
  });
  socket.addEventListener('close', () => { eventLog.textContent = 'Live updates disconnected.'; });
  socket.addEventListener('error', () => { eventLog.textContent = 'Unable to connect to live updates.'; });
}
async function loadAuction() {
  const status = document.getElementById('auction-status');
  if (!auctionId || !/^\d+$/.test(auctionId)) {
    status.textContent = 'INVALID AUCTION';
    document.getElementById('auction-description').textContent = 'Select an auction from the marketplace.';
    bidButton.disabled = true;
    return;
  }
  try {
    auction = await window.marketplace.api(`/api/auctions/auctions/${encodeURIComponent(auctionId)}/`);
    document.getElementById('auction-title').textContent = auction.product_name;
    document.getElementById('auction-description').textContent = `Seller: ${auction.seller_name} · ${auction.bid_count} bids`;
    document.getElementById('price').textContent = window.marketplace.money(auction.current_highest_bid || auction.starting_price);
    const minimum = auction.current_highest_bid
      ? Number(auction.current_highest_bid) + Number(auction.min_increment)
      : Number(auction.starting_price);
    document.getElementById('minimum').textContent = `Minimum next bid: ${window.marketplace.money(minimum)}`;
    document.getElementById('amount').min = minimum.toFixed(2);
    document.getElementById('amount').value = minimum.toFixed(2);
    status.textContent = auction.status.replaceAll('_', ' ');
    bidButton.disabled = auction.status !== 'LIVE' || !localStorage.getItem('access');
    if (auction.status !== 'LIVE') bidMessage.textContent = 'Bidding is not open for this auction.';
    if (auction.status === 'LIVE' && localStorage.getItem('access')) {
      try {
        const profile = await window.marketplace.api('/api/accounts/me/');
        if (!profile.email_verified) {
          bidButton.disabled = true;
          bidMessage.textContent = 'Verify your email before bidding. In the local Docker setup, find the verification link in the web container logs.';
        } else if (profile.is_suspended) {
          bidButton.disabled = true;
          bidMessage.textContent = 'This account is not eligible to bid.';
        } else if (profile.id === auction.seller) {
          bidButton.disabled = true;
          bidMessage.textContent = 'You cannot bid on your own auction.';
        }
      } catch (error) {
        bidButton.disabled = true;
        bidMessage.textContent = error.message;
      }
    }
  } catch (error) {
    status.textContent = 'AUCTION UNAVAILABLE';
    document.getElementById('auction-description').textContent = error.message;
    bidButton.disabled = true;
  }
}
document.getElementById('connect').addEventListener('click', connectLiveUpdates);
document.getElementById('bid-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  bidButton.disabled = true;
  bidMessage.classList.remove('text-danger');
  bidMessage.textContent = 'Submitting your bid…';
  try {
    const bid = await window.marketplace.api('/api/bidding/bids/', {
      method: 'POST',
      body: JSON.stringify({ auction: auctionId, amount: document.getElementById('amount').value }),
    });
    bidMessage.textContent = `Bid accepted: ${window.marketplace.money(bid.amount)}.`;
    await loadAuction();
  } catch (error) {
    bidMessage.textContent = error.message;
    bidMessage.classList.add('text-danger');
    bidButton.disabled = !auction || auction.status !== 'LIVE';
  }
});
loadAuction().then(() => { if (localStorage.getItem('access')) connectLiveUpdates(); });
</script>
{% endblock %}
